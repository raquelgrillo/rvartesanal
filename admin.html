<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RV Artesanal • Painel de pedidos</title>
<link rel="icon" type="image/png" href="assets/logo_rv_artesanal_c_fundo.png">
<style>
  :root { --ink:#3a2a1e; --soft:#8a7563; --line:#e7ddd2; --bg:#fbf7f2; --brand:#b5651d; --ok:#2e7d32; --no:#b23b3b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); background:#fff; }
  header img { width:36px; height:36px; }
  header h1 { font-size:18px; margin:0; }
  header .who { margin-left:auto; font-size:14px; color:var(--soft); }
  header button { margin-left:12px; }
  main { max-width:920px; margin:0 auto; padding:20px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  button.approve { background:var(--ok); color:#fff; border-color:var(--ok); }
  button.reject { background:var(--no); color:#fff; border-color:var(--no); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .login { max-width:320px; margin:60px auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; }
  .login h2 { margin-top:0; }
  label { display:block; font-size:14px; margin:12px 0 4px; }
  input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .muted { color:var(--soft); font-size:13px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .badge.pendente { background:#fff5e6; color:#8a5a00; border-color:#ffd591; }
  .badge.aprovado { background:#e9f6ea; color:var(--ok); border-color:#b7e0ba; }
  .badge.recusado { background:#fbeaea; color:var(--no); border-color:#eab8b8; }
  .items { margin:10px 0; padding-left:18px; }
  .cap { font-size:13px; background:#faf5ee; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:10px 0; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .error { color:var(--no); font-size:14px; }
  .empty { text-align:center; color:var(--soft); padding:40px 0; }
</style>
</head>
<body>
<header hidden id="topbar">
  <img src="assets/logo_rv_artesanal.png" alt="">
  <h1>Painel de pedidos</h1>
  <span class="who" id="who"></span>
  <button id="logout" type="button">Sair</button>
</header>

<main>
  <!-- Login -->
  <form class="login" id="login-form">
    <h2>Entrar</h2>
    <label for="user">Quem é você?</label>
    <select id="user" name="user">
      <option value="raquel">Raquel</option>
      <option value="ricardo">Ricardo</option>
    </select>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="error" id="login-error" hidden></p>
    <button class="primary" type="submit" style="margin-top:16px; width:100%">Entrar</button>
  </form>

  <!-- Painel -->
  <div id="panel" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-status="pendente" aria-selected="true">Pendentes</button>
      <button role="tab" data-status="aprovado" aria-selected="false">Aprovados</button>
      <button role="tab" data-status="recusado" aria-selected="false">Recusados</button>
      <button role="tab" data-status="todos" aria-selected="false">Todos</button>
    </div>
    <div id="list"></div>
  </div>
</main>

<script src="admin.js" defer></script>
</body>
</html>
